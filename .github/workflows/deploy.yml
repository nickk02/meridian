# Deploys to the Cloudflare account in the repo secrets. Runs on merge to main
# and on manual dispatch. Does nothing unless CLOUDFLARE_API_TOKEN is set, so
# forks without secrets are unaffected.
#
# Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Variables: D1_ID, KV_ID  (ids of an existing D1 database and KV namespace)
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_ID: ${{ vars.D1_ID }}
      KV_ID: ${{ vars.KV_ID }}
    steps:
      - name: Check for credentials
        id: creds
        run: echo "ok=${{ env.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci && npm run typecheck && npm run build
      - name: Ensure Vectorize index
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler vectorize create meridian-events --dimensions=768 --metric=cosine || echo "index exists or create failed; deploy will surface a real error"
      - name: Migrate and deploy
        if: steps.creds.outputs.ok == 'true'
        run: npm run migrate:remote && npm run deploy
